# PRODUCTION nginx vhost (baked into contacts-web:latest).
# The local development equivalent is .docker/nginx/default.conf -- keep them in
# step, but note two deliberate differences: fastcgi_pass targets the production
# compose service name, and the request body limit matches the app's upload limit.
server {
    listen 80;
    index index.php index.html;

    # Behind the Cloudflare tunnel, so any Host reaching us is already routed;
    # the app itself enforces its URL via APP_URL.
    server_name _;
    server_tokens off;

    # Log to stdout/stderr so `docker logs` is the single place to look.
    error_log  /dev/stderr warn;
    access_log /dev/stdout;

    root /app/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Contact images are uploaded through PHP; keep nginx's limit at or above
    # the PHP upload_max_filesize (see .docker/php/uploads.ini).
    client_max_body_size 16M;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Docker's embedded DNS. Needed because the fastcgi upstream below is given
    # as a variable, which makes nginx resolve it per request instead of once.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        # php-fpm container (compose service 'contacts'), NOT the dev name 'app'.
        #
        # Passed through a variable ON PURPOSE. With a literal hostname nginx
        # resolves it once at startup and caches the address for the life of the
        # process — so every deploy, which recreates the app container with a new
        # IP while this nginx container is left running, left nginx dialling the
        # dead address and serving 502 until someone restarted it. A variable
        # forces re-resolution, honouring the resolver's 10s TTL.
        set $app_upstream contacts:9000;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
